name: Release YAGC

on:
  push:
    tags:
      - 'v*' # Triggers workflow on tag pushes matching v* (e.g., v0.0.1, v1.0.0)

permissions:
  contents: write # Required for creating GitHub Releases

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Install LG webOS CLI
        run: npm install -g @webos-tools/cli

      - name: Package webOS App (.ipk)
        run: |
          mkdir -p build
          ares-package ./dist -o ./build --no-minify

      - name: Extract release notes
        id: extract_notes
        uses: ffurrer2/extract-release-notes@v2

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.ipk
          body: ${{ steps.extract_notes.outputs.release_notes }}
