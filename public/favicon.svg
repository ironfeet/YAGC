<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Soft Green Background -->
  <rect width="512" height="512" rx="112" fill="#bbf7d0" />
  
  <!-- Cabinet Base Body (Blue) -->
  <rect x="120" y="100" width="272" height="380" rx="30" fill="#3b82f6" />
  
  <!-- Bottom Details (Friendly Stripes instead of Coin Slots) -->
  <rect x="180" y="420" width="152" height="12" rx="6" fill="#60a5fa" />
  <rect x="200" y="445" width="112" height="12" rx="6" fill="#60a5fa" />
  
  <!-- Marquee Area (Yellow Top) -->
  <rect x="120" y="80" width="272" height="80" rx="40" fill="#facc15" />
  <rect x="120" y="120" width="272" height="40" fill="#facc15" />
  
  <!-- Cute Kawaii Lightbulb on Marquee -->
  <g transform="translate(256, 110)">
    <!-- Bulb Base -->
    <rect x="-12" y="20" width="24" height="10" rx="3" fill="#cbd5e1" />
    <line x1="-12" y1="25" x2="12" y2="25" stroke="#94a3b8" stroke-width="2" />
    <rect x="-8" y="30" width="16" height="6" rx="3" fill="#64748b" />
    
    <!-- Chubby Glass Bulb -->
    <path d="M -22,-2 C -22,-26 22,-26 22,-2 C 22,12 14,20 14,22 L -14,22 C -14,20 -22,12 -22,-2 Z" fill="#ffffff" stroke="#ef4444" stroke-width="4" stroke-linejoin="round" />
    
    <!-- Kawaii Face -->
    <!-- Eyes -->
    <circle cx="-7" cy="-1" r="2.5" fill="#1e293b" />
    <circle cx="7" cy="-1" r="2.5" fill="#1e293b" />
    <!-- Cheeks -->
    <circle cx="-12" cy="3" r="3" fill="#fca5a5" opacity="0.6" />
    <circle cx="12" cy="3" r="3" fill="#fca5a5" opacity="0.6" />
    <!-- Smile -->
    <path d="M -3,3 Q 0,7 3,3" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
    
    <!-- Glass Shine -->
    <path d="M -14,-10 A 10 10 0 0 1 -4,-16" fill="none" stroke="#f1f5f9" stroke-width="3" stroke-linecap="round" />
  </g>
  
  <!-- Screen Frame (Dark Blue) -->
  <rect x="140" y="150" width="232" height="160" rx="24" fill="#1e293b" />
  
  <!-- Screen (Bright Blue) -->
  <rect x="155" y="165" width="202" height="130" rx="16" fill="#38bdf8" />
  
  <!-- Smiling Face on Screen -->
  <!-- Eyes -->
  <circle cx="216" cy="210" r="14" fill="#ffffff" />
  <circle cx="296" cy="210" r="14" fill="#ffffff" />
  <circle cx="216" cy="210" r="6" fill="#0f172a" />
  <circle cx="296" cy="210" r="6" fill="#0f172a" />
  <!-- Cheeks -->
  <circle cx="186" cy="235" r="10" fill="#0ea5e9" opacity="0.6" />
  <circle cx="326" cy="235" r="10" fill="#0ea5e9" opacity="0.6" />
  <!-- Smile -->
  <path d="M 230,245 Q 256,270 282,245" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  
  <!-- Control Panel (Red Chunky Ledge) -->
  <rect x="90" y="320" width="332" height="80" rx="40" fill="#ef4444" />
  <rect x="100" y="330" width="312" height="20" rx="10" fill="#f87171" opacity="0.5" />
  
  <!-- Joystick -->
  <ellipse cx="160" cy="350" rx="24" ry="12" fill="#1e293b" opacity="0.4" />
  <!-- Stick crossing over the screen -->
  <line x1="160" y1="350" x2="160" y2="260" stroke="#cbd5e1" stroke-width="16" stroke-linecap="round" />
  <!-- Giant Ball -->
  <circle cx="160" cy="260" r="28" fill="#facc15" />
  <circle cx="150" cy="250" r="8" fill="#ffffff" opacity="0.8" />
  
  <!-- Oversized Friendly Buttons -->
  <!-- Green Button -->
  <circle cx="260" cy="360" r="20" fill="#22c55e" />
  <circle cx="260" cy="355" r="12" fill="#4ade80" />
  
  <!-- Purple Button -->
  <circle cx="320" cy="360" r="20" fill="#a855f7" />
  <circle cx="320" cy="355" r="12" fill="#c084fc" />
  
  <!-- Cyan Button -->
  <circle cx="380" cy="360" r="20" fill="#38bdf8" />
  <circle cx="380" cy="355" r="12" fill="#7dd3fc" />
</svg>